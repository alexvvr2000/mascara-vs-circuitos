# La implementación del autor

**El stack que eligió quien escribió esto, y nada más.** **No es una recomendación, y no se publica como instrucción.**

---

## Por qué esta carpeta existe

**Porque la elección de un stack es una decisión del autor, y el repositorio se concentra primero en la metodología.**

**Así que aquí no hay plantillas, ni archivos para copiar, ni instrucciones de instalación.** **Hay el stack, escrito tal como se eligió, para que se sepa cuál fue y no se confunda con un requisito.**

**Y lo que el repositorio sostiene desde el primer ensayo:** **el cruzado, el stack es un gusto.** **El que venga puede usar este, o cualquiera.**

---

## El stack

```yaml
# implementacion del autor — no es una recomendación
ente:        lo que se levanta
dueno:       Alejandro Valenzuela Rivera

motor:       DeepSeek Harness
             todo es un plugin: modelos, herramientas, sesiones, UI

catalogo:    dshmarket
             el mercado de plugins dentro de DSH. la vía por la que una
             implementación llega a otras manos, con un clic

cuerpo:      declarado, e intercambiable
             el criterio no vive acá; vive en la base

base:        graphdblite
             base de grafos, embebida, con Cypher, sobre SQLite
             un archivo, sin servidor, sin configuración

             y no es un gusto como los otros dos: el índice es un grafo
             con tres relaciones —contiene, asocia, supera— y la consulta
             que más se va a hacer es por dónde se llega de un tema a otro

             en una tabla eso es un recorrido recursivo escrito a mano;
             en un grafo es -[:ASOCIA*1..3]->
```

**Y la forma de la carpeta, tal como se planeó:**

```plaintext
implementation/
  template.md      el AGENTS.md, inmutable: qué ejecutar y cuándo
  skills/          lo que el ente sabe hacer
  scripts/         lo que el ente corre
  readme.md        qué es esto y cómo se usa

y al soltarla en un proyecto aparece:

  entity/          la base, en graphdblite
                     nodos:    hecho · fricción · desenlace · tema · pieza
                     aristas:  CONTIENE · ASOCIA · SUPERA
```

---

## Lo que todavía no está

```plaintext
template.md        escrito, y no probado en un DSH limpio
skills/            escrito, y no probado
scripts/           escrito, y no probado
entity/            no existe
```

**Y esta carpeta no los escribe.** **Los va a escribir cuando la metodología esté cerrada, y entonces vendrán aquí, o no vendrán.**

---

## Falsificador

**Un stack del autor presentado como requisito del trabajo.**

**La señal, en el acto:** **si una página del repositorio dice «hay que usar» alguna de estas tres cosas.**

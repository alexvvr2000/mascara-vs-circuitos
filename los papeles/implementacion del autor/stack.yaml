# Implementación del autor
#
# Esto es un YAML de verdad: parsee con cualquier parser y no falla.
# Cada campo tiene un comentario arriba que dice qué poner.
# Los que están vacíos son los que tienes que llenar.

ente: ""
# ¿Qué es el ente? Un nombre corto.
#   ejemplo: "el que revisa contratos"

dueno: ""
# ¿Quién decide lo que el ente no decide? Con nombre.
#   ejemplo: "Alejandro Valenzuela Rivera"

motor: "DeepSeek Harness"
# Dónde vive el ente. Todo en DSH es un plugin.

motor_version: ">=0.2.1"
# La versión mínima del motor que se necesita.

catalogo: "dshmarket"
# Cómo llega a otras manos. Se instala desde dentro de DSH.

catalogo_version: "^1.66.44"

base: "graphdblite"
# Dónde vive el criterio. En un grafo, porque el índice tiene tres
# relaciones: contiene, asocia, supera.
#
#   otras opciones válidas: sqlite, postgres, un archivo de texto

base_version: ""
# La versión de la base, si se sabe. Si no, se deja vacío.

cuerpo: ""
# Qué modelo piensa. Se declara, no se deduce.
#   ejemplo: "DeepSeek V4.1 Flash por OpenCode Go"

cuerpo_sesgo: ""
# Lo que se sabe que ese modelo hace mal.
#   ejemplo: "complacer, rellenar, inflar la forma"

autoridad:
  nombre: ""
  # Quién firma lo que el ente propone. Con nombre, y persona.

  no_decide: ""
  # Lo que el ente no decide nunca.
  #   ejemplo: "nada que comprometa a alguien más"

carpetas:
  template: "template.md"
  # El AGENTS.md, inmutable: qué ejecutar y cuándo.

  skills: "skills/"
  # Lo que el ente sabe hacer.

  scripts: "scripts/"
  # Lo que el ente corre.

  entity: "entity/"
  # La base. Nace al soltar la implementación en un proyecto.

no_esta:
  - "template.md"
  - "skills/"
  - "scripts/"
  - "entity/"
# Lo que todavía no existe. Cuando algo de aquí se escriba, se borra de
# esta lista, y no antes.
